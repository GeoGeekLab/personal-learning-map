<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Personal Learning Map</title>
<style>
html,body{margin:0;min-height:100%;background:#F7F2EB;color:#081F5C;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.loader{min-height:100vh;display:grid;place-items:center;padding:32px}.loader-inner{max-width:520px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;opacity:.58}.title{font-family:Georgia,"Times New Roman",serif;font-size:38px;line-height:1.08;margin:14px 0 12px}.status{font-size:13px;line-height:1.7;opacity:.68}.bar{height:2px;background:rgba(8,31,92,.12);margin-top:22px;overflow:hidden}.bar:after{content:"";display:block;width:42%;height:100%;background:#334EAC;animation:move 1.1s ease-in-out infinite alternate}@keyframes move{from{transform:translateX(-100%)}to{transform:translateX(240%)}}
</style>
</head>
<body>
<div class="loader"><div class="loader-inner"><div class="eyebrow">GeoGeekLab · Research Map</div><div class="title">Personal Learning Map</div><div class="status" id="status">Loading the capability architecture…</div><div class="bar"></div></div></div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    const files=['assets/site.part1.txt','assets/site.part2.txt','assets/site.part3.txt','assets/site.part4.txt'];
    const parts=await Promise.all(files.map(async path=>{const r=await fetch(path,{cache:'no-cache'});if(!r.ok)throw new Error(path+' '+r.status);return r.text()}));
    const b64=parts.join('').replace(/\s+/g,'');
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window))throw new Error('This browser does not support DecompressionStream.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(err){
    console.error(err);
    status.textContent='The map could not be loaded. Open the repository and refresh, or use a current browser.';
  }
})();
</script>
</body>
</html>
